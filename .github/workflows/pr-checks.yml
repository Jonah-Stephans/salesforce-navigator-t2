# Written inline on purpose. The estate's convention (banksy/.github/workflows)
# is three lines delegating to a reusable workflow in rootstockmfg/cm, which a
# personal repo cannot reach and, more to the point, which fit-check cannot read
# inside: its rule 3 downgrades any absent verdict behind an external workflow to
# "could not determine". Five of twenty-five entries would come back as shrugs.
name: pr-checks

on:
  pull_request:
    branches: [main]
    # GitHub's default activity types are [opened, synchronize, reopened].
    # ready_for_review is not one of them, and every job below is guarded on
    # `draft == false`, so a pull request opened as a draft runs nothing, and
    # marking it ready triggers nothing either — its checks stay pinned to the
    # draft-era run reporting `skipping`, which reads as "ran, nothing to do"
    # rather than "never ran". Naming the list is what closes that;
    # ready_for_review is the only addition to the default three.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  # Entry 5 — no CI on drafts. The spelling is load-bearing: `draft == false`
  # compares a boolean to a boolean. `draft == 'false'` coerces the string to
  # NaN, never matches, and blocks every run; fit-check calls that a defect.
  # Every job below repeats the guard, because a job-level `if` is the only
  # place it can live once the jobs are independent.

  open-boxes:
    name: no undispositioned open boxes
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff below needs the base commit, which a depth-1 checkout of
          # the merge ref does not have.
          fetch-depth: 0
      - name: sweep the spec directories this pull request touches
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # This job used to build its sweep path by gluing `devpath/` onto the
          # head ref, which only resolves on a branch named after a spec
          # directory. A lessons branch is already devpath/lessons/<slug>, so
          # the path doubled; a ci/ or chore/ branch has no spec directory at
          # all. Either way the path did not exist and the job went red for a
          # reason unrelated to open boxes. Skipping branches whose name held a
          # slash fixed the symptom and left the guess in place.
          #
          # The spec directories now come from the diff, so nothing here
          # depends on what anybody named a branch. `dev-path/` (hyphenated) is
          # matched alongside `devpath/` because the first spec on this repo
          # predates the current convention; if the plugin renames the
          # directory again, this alternation is the one line to extend, and
          # until it is extended the job sweeps nothing rather than failing
          # every pull request.
          # Both the diff and the fallback below are defined against a pull
          # request, so refuse anything else loudly. A gate that sweeps nothing
          # and reports green is a worse failure than one that stops the build:
          # silence here reads as "no open boxes" to every later reader,
          # including Integrate. This is what the old `${GITHUB_HEAD_REF:?}`
          # bought, kept now that the ref is no longer interpolated into a path.
          : "${GITHUB_HEAD_REF:?not a pull request build}"

          SPECS=$(git diff --name-only "$(git merge-base "$BASE" HEAD)" HEAD \
                  | grep -oE '^(devpath|dev-path)/[^/]+/' | sed 's:/$::' | sort -u)

          # Additive: a spec branch whose pull request edited only code still
          # gets its own spec swept. Guarded on the directory existing, so it
          # cannot reintroduce the missing-path failure this replaced, and on a
          # non-empty ref independently of the check above. With an empty ref
          # these tests reduce to `[ -d devpath/ ]`, which is true, and SPECS
          # collapses to the whole tree — the unscoped sweep that fails this
          # spec on a neighbouring spec's open boxes. Belt and braces on
          # purpose: the guard above is a policy choice someone may revisit,
          # this one is what keeps the fallback correct if they do.
          if [ -n "$GITHUB_HEAD_REF" ]; then
            for p in "devpath/$GITHUB_HEAD_REF" "dev-path/$GITHUB_HEAD_REF"; do
              if [ -d "$p" ]; then SPECS=$(printf '%s\n%s\n' "$SPECS" "$p"); fi
            done
          fi

          # Keep only paths that exist at HEAD. A pull request deleting a spec
          # directory would otherwise hand grep a missing path, where it exits
          # 2 and the leading `!` below would read that as a pass.
          KEPT=""
          for p in $SPECS; do
            if [ -d "$p" ]; then KEPT="$KEPT $p"; fi
          done
          SPECS=$(printf '%s' "$KEPT" | tr ' ' '\n' | sort -u | tr '\n' ' ' | sed 's/^ *//;s/ *$//')

          if [ -z "$SPECS" ]; then
            echo "No spec directory in this diff, and none named by the branch. Nothing to sweep."
            exit 0
          fi

          # `^[[:space:]]*`, never a bare `^`. A formatter that renests a
          # list indents the box; under a bare `^` the grep finds nothing, the
          # job goes green, and Integrate arms a merge on a spec holding an
          # open box, with no second check that would notice. devpath's own
          # tests/gate.sh check 4 exists to stop this anchor being narrowed.
          echo "Sweeping: $SPECS"
          ! grep -rn '^[[:space:]]*- \[ \]' $SPECS

  lwc-tests:
    name: LWC jest suite
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Entry 19 — the suite the scaffold already provides. Corroborated by
      # @salesforce/sfdx-lwc-jest in devDependencies rather than by this line
      # alone. --passWithNoTests keeps it honest before the first LWC exists,
      # instead of green because the runner found nothing and shrugged.
      # The doubled `--` is not a typo. npm strips the first one, and
      # sfdx-lwc-jest needs its own `--` before it will forward a flag to jest;
      # with a single `--` the flag is swallowed and the job is red on an empty
      # repo, which is the opposite of what --passWithNoTests is here for.
      - name: npm run test:unit
        run: npm run test:unit -- -- --passWithNoTests

  slds-styling:
    name: no hard-coded colour, spacing or typography
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Outcome 9's gate. `npm run lint` carries --max-warnings 0, and that
      # flag is the whole job: @salesforce-ux/eslint-plugin-slds reports a
      # hard-coded colour at severity *warning*, and warnings exit 0, so the
      # obvious lint job goes green on a stylesheet made entirely of hex codes.
      - name: npm run lint
        run: npm run lint
      # And this asserts the flag is still doing that work, against a fixture
      # pair the ordinary run ignores. Without it, a later edit that drops
      # --max-warnings 0 leaves every check green and the Outcome unguarded.
      - name: npm run lint:slds-gate
        run: npm run lint:slds-gate

  changed-lines:
    name: added lines carry no debug statements
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Entry 17 — scoped to the changed lines, not the changed files and not
      # the repo. --unified=0 drops context lines, so every `+` this sees was
      # actually added by this pull request.
      - name: git diff --unified=0 over the added lines
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          BASE=$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)
          ADDED=$(git diff --unified=0 "$BASE"...HEAD -- 'force-app/**' \
                  | grep '^+' | grep -v '^+++' || true)
          BAD=$(printf '%s\n' "$ADDED" \
                | grep -nE 'System\.debug\(|console\.log\(' || true)
          if [ -n "$BAD" ]; then
            echo "Added lines carry debug statements:"
            printf '%s\n' "$BAD"
            exit 1
          fi
          echo "No debug statements in added force-app lines."

  flow-status:
    name: flows are Active or Obsolete
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Entry 18 — the Navigator has no flows, so today this asserts over an
      # empty set and passes. Written anyway: three lines, and the entry goes
      # from "not observable" to observable the moment a flow lands.
      - name: assert every flow's status
        run: |
          BAD=$(grep -l '<status>' -r force-app --include='*.flow-meta.xml' 2>/dev/null \
                | xargs -r grep -L '<status>\(Active\|Obsolete\)</status>' || true)
          if [ -n "$BAD" ]; then
            echo "Flows whose status is neither Active nor Obsolete:"
            printf '%s\n' "$BAD"
            exit 1
          fi
          echo "Flow status check passed (empty set is a pass here)."

  metadata-scope:
    name: does this pull request carry metadata
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      has_metadata: ${{ steps.scope.outputs.has_metadata }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Entry 20 — the guard is read off the change, never off a slice's
      # `touches`, which is empty on exactly the create-only slices this
      # judges. And it is an `if:` on this output rather than `on.*.paths`:
      # a path filter on a *required* check has the opposite effect, because a
      # check that never reports is a check that never goes green.
      - id: scope
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          BASE=$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)
          N=$(git diff --name-only "$BASE"...HEAD -- 'force-app/**' | wc -l | tr -d ' ')
          echo "changed metadata files: $N"
          if [ "$N" -gt 0 ]; then
            echo "has_metadata=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_metadata=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-gate:
    name: deploy gate
    needs: metadata-scope
    if: >-
      github.event.pull_request.draft == false &&
      needs.metadata-scope.outputs.has_metadata == 'true'
    runs-on: ubuntu-latest
    # The secret is mapped to an env var here rather than read in a step `if`.
    # The secrets context is not available in an if expression; mapping it to
    # env at job level is the supported way to branch on a secret's presence.
    env:
      HAS_CI_ORG: ${{ secrets.SFDX_AUTH_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      # This repo holds no CI credential, so the gate is declared and not
      # exercised. It is gated on a secret that does not exist rather than left
      # to fail on authentication, because a permanently red required check
      # cannot be merged past and would deadlock the trial. This annotation
      # exists so the skip cannot be read as a pass.
      - name: report that the gate is unexercised
        if: env.HAS_CI_ORG != 'true'
        run: |
          echo "::warning title=Deploy gate declared, not exercised::This repository holds no CI Salesforce credential. The guard and the test level are written and correct; nothing has run them against a real org. Do not read this job green as a passing deploy."

      - uses: actions/setup-node@v4
        if: env.HAS_CI_ORG == 'true'
        with:
          node-version: "20"

      - name: authenticate, deploy and run local tests
        if: env.HAS_CI_ORG == 'true'
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          npm install --global @salesforce/cli
          printf '%s' "$SFDX_AUTH_URL" > "$RUNNER_TEMP/authurl.txt"
          sf org login sfdx-url --sfdx-url-file "$RUNNER_TEMP/authurl.txt" --alias ci --set-default
          # RunLocalTests, not RunSpecifiedTests: the whole-spec gate asserts
          # the package's own suite, and a named subset would let an untouched
          # class rot behind a green check.
          sf project deploy start --test-level RunLocalTests --wait 60
