<template>
  <lightning-card title="Salesforce Navigator" icon-name="standard:choice">
    <!-- Gated on the same fact the sections are, and for the same reason: a
         click before pagination finishes seeds All Items from the pages
         received so far, and a click before the stored layout arrives is
         overwritten when it does. -->
    <template lwc:if={canEdit}>
      <!-- The active layout's name *is* the menu button, which is what makes
           "which layout am I looking at" answerable without opening anything.
           Every layout the user owns is listed with the active one checked, so
           the menu reports state as well as accepting input — the same shape
           as the section's column-count entries. -->
      <lightning-button-menu
        slot="actions"
        class="rstk-nav-layout-menu"
        label={layoutName}
        alternative-text="Switch layout"
        menu-alignment="auto"
        onselect={handleLayoutMenuSelect}
      >
        <template for:each={layoutChoices} for:item="choice">
          <lightning-menu-item
            key={choice.value}
            value={choice.value}
            label={choice.label}
            checked={choice.checked}
          ></lightning-menu-item>
        </template>
        <!-- The Tier 2 / Tier 3 split, rendered inside one control. Choosing
             which saved layout you are looking at is navigation and stays
             available always; naming, creating and deleting layouts is
             customisation and is gated with everything else. Absent from the
             DOM rather than disabled, so neither the tab order nor a screen
             reader can reach an entry the user is not being offered. -->
        <!-- Sixth pass: New layout, Rename layout and Delete layout are three
             of the four writing controls the lockout disables while any of
             them has a round trip outstanding — `disabled`, not `lwc:if`,
             because this is a transient busy state rather than a mode; the
             opposite of the absence rule the gate itself uses elsewhere, and
             deliberately so. See `isWriteLocked`. -->
        <template lwc:if={isEditing}>
          <lightning-menu-divider></lightning-menu-divider>
          <lightning-menu-item
            value="new-layout"
            label="New layout…"
            disabled={isWriteLocked}
          ></lightning-menu-item>
          <lightning-menu-item
            value="rename-layout"
            label="Rename layout…"
            disabled={isWriteLocked}
          ></lightning-menu-item>
          <!-- Absent, not disabled, for a user with no stored layout: there is
               nothing to delete, and an entry that cannot do what it says is
               worse than one that is not offered. -->
          <template lwc:if={canDeleteLayout}>
            <lightning-menu-item
              value="delete-layout"
              label="Delete layout…"
              disabled={isWriteLocked}
            ></lightning-menu-item>
          </template>
        </template>
      </lightning-button-menu>

      <!-- The top right, in its two states. In edit mode:
           [ switcher ] [ New section ] [ Cancel ] [ Save ]. Out of it:
           [ switcher ] [ edit ]. The affordance is *replaced* by Save and
           Cancel rather than joined by them, so there is exactly one way to
           leave the mode from the action row; Save carries `variant="brand"`
           and sits last, per the SLDS convention that the primary action in an
           action row is the rightmost one. -->
      <template lwc:if={isEditing}>
        <lightning-button
          slot="actions"
          class="rstk-nav-new-section"
          label="New section"
          onclick={handleAddSection}
        ></lightning-button>
        <lightning-button
          slot="actions"
          class="rstk-nav-edit-cancel"
          label="Cancel"
          onclick={handleEditCancel}
        ></lightning-button>
        <!-- The fourth writing control the lockout disables — see the note
             above the layout menu's New/Rename/Delete entries. Cancel is
             deliberately not one of them: it does not write, and Tier 2's
             own seam already means Cancel does not reach a Tier 2 act
             outstanding here regardless of the lockout. -->
        <lightning-button
          slot="actions"
          class="rstk-nav-edit-save"
          label="Save"
          variant="brand"
          disabled={isWriteLocked}
          onclick={handleEditSave}
        ></lightning-button>
      </template>
      <template lwc:else>
        <!-- Rendered on `canEdit` alone, which is the one control here that
             is: a Navigator whose stored layout could not be read must offer
             no way into a mode that could not save. `alternative-text` is not
             optional on an icon-only button — without it a screen reader
             announces the only route into customisation as nothing at all. -->
        <lightning-button-icon
          slot="actions"
          class="rstk-nav-edit"
          icon-name="utility:edit"
          variant="border-filled"
          alternative-text="Edit Navigator"
          title="Edit Navigator"
          onclick={handleEditStart}
        ></lightning-button-icon>
      </template>
    </template>

    <template lwc:if={isLoading}>
      <lightning-spinner
        alternative-text="Loading your tabs"
        size="small"
      ></lightning-spinner>
    </template>
    <template lwc:elseif={hasError}>
      <div class="rstk-nav-error" role="alert">
        <p class="rstk-nav-error__text">{errorMessage}</p>
      </div>
    </template>
    <template lwc:elseif={isEmpty}>
      <div class="slds-p-around_medium">
        <p>You do not have access to any tabs yet.</p>
      </div>
    </template>
    <template lwc:elseif={hasItems}>
      <!-- Beside the layout, not in place of it: the seeded Navigator below
           is complete and still navigates. The message has to be here rather
           than nowhere, because the consequence is invisible otherwise —
           this is not the user's layout, and nothing is being saved. -->
      <template lwc:if={hasLayoutLoadError}>
        <div class="rstk-nav-error" role="alert">
          <p class="rstk-nav-error__text">{layoutLoadErrorMessage}</p>
        </div>
      </template>

      <!-- Reported beside the layout, never in place of it: the change that
           failed to save is still on screen and still correct. -->
      <template lwc:if={hasSaveError}>
        <div class="rstk-nav-error" role="alert">
          <p class="rstk-nav-error__text">{saveErrorMessage}</p>
        </div>
      </template>

      <!-- Assertive rather than polite: a section the user has just moved and
           is about to move again is not something to queue behind whatever
           else the page is saying. It lives here rather than in the section
           because a section reorder rebuilds every card, and an announcement
           inside one of them would be destroyed as it was made. -->
      <span
        class="slds-assistive-text rstk-nav-announcer"
        aria-live="assertive"
        aria-atomic="true"
        >{announcement}</span
      >

      <!-- The three ellipses on the layout menu. Each is transient UI and
           writes nothing until it is committed — opening one, and cancelling
           one, must leave a user who has only ever looked with no layout row,
           which is this spec's oldest settled rule. -->
      <template lwc:if={isNamingLayout}>
        <div
          class="rstk-nav-layout-prompt"
          role="group"
          aria-label={layoutPromptLabel}
        >
          <lightning-input
            class="rstk-nav-layout-prompt__input"
            label={layoutPromptLabel}
            value={draftLayoutName}
            onchange={handleLayoutNameChange}
            oncommit={handleLayoutNameCommit}
            onkeydown={handleLayoutPromptKeydown}
          ></lightning-input>
          <lightning-button
            label={layoutPromptCommitLabel}
            variant="brand"
            onclick={handleLayoutNameCommit}
          ></lightning-button>
          <lightning-button
            label="Cancel"
            onclick={handleLayoutPromptCancel}
          ></lightning-button>
        </div>
      </template>
      <template lwc:elseif={isConfirmingLayoutDelete}>
        <!-- `alertdialog` rather than a bare div: a delete is destructive and
             the confirmation has to reach a screen reader user as a decision
             to make, not as text that appeared somewhere on the page.

             As of the second fix pass: `handleLayoutMenuSelect`'s
             `DELETE_LAYOUT` branch announces this text through the live
             region as well, and `focusLayoutPrompt()` moves focus into
             "Cancel" once this renders — the same treatment the discard
             confirmation below already had, given to its twin so the one
             irreversible confirmation in this component is not also the one
             that reaches a screen-reader user as nothing. -->
        <div
          class="rstk-nav-layout-prompt"
          role="alertdialog"
          aria-label="Delete layout"
          onkeydown={handleLayoutPromptKeydown}
        >
          <p class="rstk-nav-layout-prompt__text">{layoutDeleteMessage}</p>
          <lightning-button
            label="Delete layout"
            variant="destructive"
            onclick={handleLayoutDeleteConfirm}
          ></lightning-button>
          <!-- `focusLayoutPrompt()` targets this class deliberately: the
               safe default, never "Delete layout", so a stray Enter on the
               control that just took focus cannot fire the destructive act. -->
          <lightning-button
            class="rstk-nav-delete-cancel"
            label="Cancel"
            onclick={handleLayoutPromptCancel}
          ></lightning-button>
        </div>
      </template>
      <template lwc:elseif={isConfirmingDiscard}>
        <!-- The shared discard-confirmation prompt: Cancel, switching to a
             different saved layout, New layout and Delete layout all reach
             this one dialog rather than each growing its own, per
             `## Design`'s "Leaving edit mode with unsaved work" — the same
             inline-prompt idiom the two prompts above already use, borrowing
             `PROMPT_DELETE`'s input-less shape rather than adding a third
             dialog mechanism beside this one and the item picker's
             `LightningModal`. `alertdialog`, for the same reason the delete
             confirmation above is one: a screen reader user needs this to
             read as a decision to make, not as text that appeared.

             As of the fix pass: `openDiscardPrompt()` announces this text
             through the live region as well, and `focusLayoutPrompt()` moves
             focus into "Keep editing" once this renders — an `alertdialog`
             nothing focuses and nothing announces is exactly the failure
             `lwc-accessible-interactions.md` was written against. -->
        <div
          class="rstk-nav-layout-prompt"
          role="alertdialog"
          aria-label="Discard unsaved changes"
          onkeydown={handleLayoutPromptKeydown}
        >
          <p class="rstk-nav-layout-prompt__text">{discardPromptMessage}</p>
          <lightning-button
            label="Discard changes"
            variant="destructive"
            onclick={handleDiscardConfirm}
          ></lightning-button>
          <!-- `focusLayoutPrompt()` targets this class deliberately: the
               safe default, never "Discard changes", so a stray Enter on the
               control that just took focus cannot fire the destructive act. -->
          <lightning-button
            class="rstk-nav-discard-keep-editing"
            label="Keep editing"
            onclick={handleLayoutPromptCancel}
          ></lightning-button>
        </div>
      </template>

      <div class={sectionsCanvasClass}>
        <template for:each={sections} for:item="section">
          <!-- `class={section.spanClass}` is bound here, on the grid's own
               direct child, rather than on anything inside `c-navigator-section`'s
               shadow root: `.rstk-nav-sections` in salesforceNavigator.css is
               the six-track grid, and its actual children are these
               `<c-navigator-section>` hosts, not any element inside them. A
               `grid-column` rule reaches nothing written against the card
               inside — see `.rstk-nav-section_span-N` in
               salesforceNavigator.css and the note in navigatorSection.js's
               `cardClass`. -->
          <c-navigator-section
            key={section.key}
            class={section.spanClass}
            section={section}
            editing={isEditing}
            grabbed={section.isGrabbed}
            item-drag-active={isItemDragActive}
            onsectionrename={handleSectionRename}
            onsectioncolumns={handleSectionColumns}
            onsectiondelete={handleSectionDelete}
            onsectionadditems={handleSectionAddItems}
            onitemremove={handleItemRemove}
            onitemmove={handleItemMove}
            onitemmoveto={handleItemMoveTo}
            onitemrename={handleItemRename}
            onitemdragstart={handleItemDragStart}
            onsectiondragstart={handleSectionDragStart}
            onsectiondrop={handleSectionDrop}
            onsectiondragend={handleSectionDragEnd}
            onsectiongrab={handleSectionGrab}
            onsectionkeymove={handleSectionKeyMove}
            onsectionkeydrop={handleSectionKeyDrop}
            onsectionkeycancel={handleSectionKeyCancel}
          ></c-navigator-section>
        </template>
      </div>
    </template>
  </lightning-card>
</template>
