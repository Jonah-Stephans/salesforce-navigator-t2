<template>
  <lightning-card title="Salesforce Navigator" icon-name="standard:choice">
    <template lwc:if={isLoading}>
      <lightning-spinner
        alternative-text="Loading your tabs"
        size="small"
      ></lightning-spinner>
    </template>
    <template lwc:elseif={hasError}>
      <div class="rstk-nav-error" role="alert">
        <p class="rstk-nav-error__text">{errorMessage}</p>
      </div>
    </template>
    <template lwc:elseif={isEmpty}>
      <div class="slds-p-around_medium">
        <p>You do not have access to any tabs yet.</p>
      </div>
    </template>
    <template lwc:elseif={hasItems}>
      <ul
        class="slds-grid slds-wrap rstk-nav-item-list"
        aria-label="Your accessible tabs"
      >
        <template for:each={items} for:item="item">
          <li
            key={item.developerName}
            class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-large-size_1-of-4 slds-p-around_x-small"
          >
            <c-navigator-item
              tab-id={item.developerName}
              label={item.label}
              page-reference={item.pageReference}
            ></c-navigator-item>
          </li>
        </template>
      </ul>
    </template>
  </lightning-card>
</template>
